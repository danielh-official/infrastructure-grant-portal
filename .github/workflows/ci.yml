name: Portal checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: find public src views -name '*.php' -exec php -l {} \;
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: github.ref_name != 'baseline/inaccessible'
        run: npm run test:audit
